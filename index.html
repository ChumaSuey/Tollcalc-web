<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f4f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1014"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Calculadora de peajes rápida y sencilla, pensada para el móvil."
    />
    <title>Calculadora de Peajes</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('tollcalc-theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
